version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: odri-monitor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-odri_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odri_secure_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-odri_monitor_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - odri-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odri_admin} -d ${POSTGRES_DB:-odri_monitor_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: odri-monitor-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-odri_admin}:${POSTGRES_PASSWORD:-odri_secure_password_123}@postgres:5432/${POSTGRES_DB:-odri_monitor_db}
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - odri-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: odri-monitor-frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=/api/v1
      - VITE_WS_BASE_URL=/ws
    networks:
      - odri-network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: odri-monitor-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    networks:
      - odri-network

networks:
  odri-network:
    driver: bridge

volumes:
  postgres_data:
